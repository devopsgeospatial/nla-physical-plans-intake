name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Shapefile/GeoJSON parsing, attribute mapping, TM Rwanda projection)
        run: npm test
      - name: Build + end-to-end tests (sign-in, append to Physical_Plans, rollback, validation vs emulator)
        run: npm run test:e2e
